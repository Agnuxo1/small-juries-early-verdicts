name: Portable policy
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.4.0 pytest==8.3.4
      - run: python -m pytest tests/test_deployment_policy.py -q
